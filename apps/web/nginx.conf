server {
  listen 80;
  root /usr/share/nginx/html;

  # Built assets have hashed names, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # The map's worker is an .mjs file; browsers only run it with a JavaScript content type.
    location ~ \.mjs$ {
      default_type application/javascript;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # Single-page app: every other path serves index.html (never cached, so deploys show up at once).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
